[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "factorbench"
version = "0.1.0"
description = "Sparse factorizations for the stacked Newton Jacobian of a large forward-looking economic model (MAKRO)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["numpy", "scipy", "psutil"]

[project.optional-dependencies]
pardiso = ["pypardiso"]                    # MKL PARDISO (pulls in mkl): methods 'pardiso' and 'normal'
mumps = ["python-mumps"]                   # MUMPS: method 'mumps' (pip wheels for Linux/macOS; on Windows use conda)
gpu = ["nvmath-python[cu12]"]              # NVIDIA cuDSS: methods 'cudss' and 'cudss_normal' (CUDA 12 driver)
gpu13 = ["nvmath-python[cu13]"]            # the same for CUDA 13

[tool.setuptools.packages.find]
include = ["factorbench*"]
